# gitleaks configuration. Extends the default rules and only allows placeholder
# files, never real values.
title = "Invoxa"

[extend]
useDefault = true

[allowlist]
description = "Placeholders, documentation, and the test-only signing key fixture"
paths = [
  '''\.env\.example$''',
  '''docs/limits\.md$''',
]
# The generic-api-key rule flagged a deterministic test signing key in M2's
# history. It is a fixture, never a credential; the source was also rewritten so
# no new commit can trip the rule.
regexes = [
  '''test-secret-that-is-long-enough-1234''',
]
