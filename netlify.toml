# Netlify configuration for the Expo web build.
#
# The site needs one environment variable in the Netlify UI:
#   EXPO_PUBLIC_API_URL = https://<api-host>/api/v1
# It is baked into the bundle at build time, so changing it needs a redeploy.

[build]
  command = "npm run build:web"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "22"

# Expo Router's web export is a single page: every route is served index.html
# and routed on the client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundle and asset names never change between builds.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
